[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qibolab-cudaq-emulator"
version = "0.1.0"
description = "External CUDA-Q emulator plugin for qibolab main"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "qibolab==0.2.15",
  "cudaq==0.14.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]